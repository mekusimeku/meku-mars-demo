name: MARS tests (offline)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run all tests (no network, no dependencies)
        run: node --test tests/*.test.mjs
      - name: Fixture is reproducible from the engine
        run: node contract/make-fixture.mjs | diff - contract/fixture-seed-7.json
